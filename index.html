<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Flourish">
<meta name="theme-color" content="#F1E8D8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Flourish Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,300;1,9..144,400;1,9..144,600&display=swap">
<style>
/* Layout: a paper planner. A cover page, then cream paper sheets with binder tabs down the right edge
   (a scrolling tab row on phones). --a / --b / --ink are the day's pastels, swapped in by script each date.
   Single warm-paper look on purpose. */
:root{
  --a:#D9CCF5; --b:#FFF1A8; --ink:#6B55A8;
  --desk:color-mix(in srgb,var(--a) 22%,#F1E8D8);
  --paper:#FBF8F1; --card:#FFFDF8; --edge:#E6DCC8; --rule:color-mix(in srgb,var(--ink) 22%,#E6DCC8);
  --text:#2E2A33; --muted:#6B6670;
  --deep:color-mix(in srgb,var(--ink) 82%,#1d1a22);
  --tintA:color-mix(in srgb,var(--a) 70%,#fff); --tintB:color-mix(in srgb,var(--b) 70%,#fff);
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"DM Sans",-apple-system,"Segoe UI",Roboto,sans-serif;
  --hand:"Caveat","Bradley Hand","Segoe Print",cursive;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--desk)}
body{color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5;transition:background .6s}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
input:focus,textarea:focus{outline:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
input::placeholder,textarea::placeholder{color:#9A9488}

/* ---- the book ---- */
.book{max-width:1010px;margin:0 auto;padding-inline:16px;padding-block:22px 40px;display:flex;align-items:flex-start}
.sheet{flex:1;min-width:0;background:var(--paper);border-radius:26px;padding:34px 40px 40px;display:flex;flex-direction:column;gap:22px;position:relative}
.binder{width:70px;flex:none;padding-top:54px;display:flex;flex-direction:column;gap:5px;position:sticky;top:env(safe-area-inset-top,0px);max-height:100vh;overflow-y:auto;scrollbar-width:none}
.binder::-webkit-scrollbar{display:none}
.binder button{border:0;width:50px;height:82px;border-radius:0 14px 14px 0;writing-mode:vertical-rl;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text);transition:width .2s}
.binder button:nth-child(3n+1){background:var(--tintA)}
.binder button:nth-child(3n+2){background:var(--tintB)}
.binder button:nth-child(3n){background:color-mix(in srgb,var(--a) 35%,#EADFC9)}
.binder button:hover{width:56px}
.binder button[aria-current="true"]{width:62px;background:var(--deep);color:#FBF8F1}
@media (max-width:760px){
  .book{flex-direction:column-reverse;align-items:stretch;padding-block:10px 32px}
  .binder{width:auto;max-width:100%;flex-direction:row;padding:0 10px;gap:4px;overflow-x:auto;overflow-y:hidden;position:static;max-height:none}
  .binder button{writing-mode:horizontal-tb;width:auto;height:40px;padding:0 13px;border-radius:14px 14px 0 0;white-space:nowrap;flex:none;font-size:10px}
  .binder button:hover{width:auto}
  .binder button[aria-current="true"]{width:auto;height:46px;margin-top:-6px}
  .sheet{padding:24px 18px 30px;border-radius:22px;gap:18px}
}

/* ---- type ---- */
.eyebrow{font-size:11.5px;letter-spacing:.26em;text-transform:uppercase;font-weight:700;color:var(--ink)}
h1{font-family:var(--serif);font-style:italic;font-weight:400;font-size:clamp(2.3rem,7vw,3.5rem);line-height:1.02;color:var(--deep);margin:6px 0 0;text-wrap:balance}
h2{font-family:var(--serif);font-weight:600;font-size:1.2rem;color:var(--deep);margin:0;text-wrap:balance}
.hand{font-family:var(--hand);font-size:1.6rem;line-height:1.2;color:var(--deep)}
.lede{margin:10px 0 0;color:var(--muted);font-size:1rem;max-width:34em}
.muted{color:var(--muted)}.small{font-size:.84rem}
.footline{margin:4px 0 0;text-align:center;font-family:var(--hand);font-size:1.7rem;color:var(--deep)}

/* ---- top strip on each page ---- */
.strip{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.swatch{display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.swatch i{width:15px;height:15px;border-radius:50%;display:inline-block;margin-right:-4px;border:2px solid var(--paper)}
.datebar{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--edge);border-radius:999px;padding:3px}
.datebar button{border:0;background:none;width:32px;height:32px;border-radius:50%;color:var(--deep);font-size:1.1rem}
.datebar button:hover{background:var(--tintA)}
.datebar .lbl{padding:0 6px;font-weight:700;font-size:.85rem;white-space:nowrap}
.datebar .tb{width:auto;padding:0 10px;border-radius:999px;font-size:.75rem;font-weight:700;background:var(--tintB)}

/* ---- page header with illustration ---- */
.head{display:flex;gap:26px;align-items:center}
.head > div{min-width:0}
.banner{border-radius:22px;overflow:hidden;position:relative}
.banner svg{display:block;width:100%;height:auto}
.banner .over{position:absolute;left:28px;bottom:22px;right:28px}
.arch{width:200px;max-width:42%;flex:none;aspect-ratio:200/250;border-radius:100px 100px 16px 16px;overflow:hidden}
.arch svg{width:100%;height:100%;display:block}
@media (max-width:560px){.head{flex-direction:column;align-items:flex-start;gap:14px}.arch{width:150px;max-width:60%}.banner .over{left:18px;bottom:14px}}

/* ---- boxes ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:16px}
.grid.wide{grid-template-columns:minmax(0,1fr) minmax(0,1.45fr)}
@media (max-width:700px){.grid.wide{grid-template-columns:minmax(0,1fr)}}
.box{background:var(--card);border:1px solid var(--edge);border-radius:22px;padding:20px 22px;display:flex;flex-direction:column;gap:12px;min-width:0}
.box.a{background:var(--tintA);border-color:transparent}
.box.b{background:var(--tintB);border-color:transparent}
.box.deep{background:var(--deep);border-color:transparent;color:#FBF8F1}
.box.deep h2,.box.deep .hand{color:#FBF8F1}
.box.deep .eyebrow{color:var(--b)}
.box.dash{border-style:dashed;border-color:color-mix(in srgb,var(--ink) 30%,#CDBF9F)}
.boxhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.count{font-family:var(--hand);font-size:1.5rem;color:var(--ink)}

/* ---- fields ---- */
.line{width:100%;min-width:0;border:0;border-bottom:1.5px solid var(--rule);background:transparent;padding:10px 2px;font-size:15px}
.line:focus{border-bottom-color:var(--ink)}
.box.deep .line{border-bottom-color:color-mix(in srgb,var(--b) 50%,transparent);color:#FBF8F1}
.box.deep .line::placeholder{color:color-mix(in srgb,#fff 55%,transparent)}
.lined{width:100%;border:0;resize:vertical;padding:0 2px;line-height:32px;font-size:15px;min-height:130px;
  background:repeating-linear-gradient(transparent 0 31px,var(--rule) 31px 32px);background-attachment:local}
.box.deep .lined{color:#FBF8F1;background:repeating-linear-gradient(transparent 0 31px,color-mix(in srgb,#fff 25%,transparent) 31px 32px)}
.pagewrite{min-height:62vh;font-size:16.5px;line-height:34px;background:repeating-linear-gradient(transparent 0 33px,var(--rule) 33px 34px);background-attachment:local}
.pill{height:44px;border:1px solid var(--edge);border-radius:14px;padding:0 14px;background:var(--paper);min-width:0;flex:1}
.addrow{display:flex;gap:8px}
.btn{height:44px;border:0;border-radius:14px;padding:0 18px;background:var(--ink);color:#fff;font-weight:700;white-space:nowrap}
.btn.soft{background:var(--tintB);color:var(--deep)}
.btn.line2{background:transparent;border:1px solid var(--edge);color:var(--deep)}
.btn.sm{height:36px;padding:0 13px;border-radius:999px;font-size:.82rem}
.box.deep .btn{background:var(--b);color:var(--deep)}
.x{width:36px;height:36px;border:0;background:none;color:#9A9488;border-radius:10px;flex:none;font-size:1.05rem}
.x:hover{background:var(--tintA);color:var(--deep)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--edge);background:var(--paper);font-size:.88rem}
.chip.on{background:var(--deep);border-color:var(--deep);color:#FBF8F1}
.chip.onb{background:var(--b);border-color:color-mix(in srgb,var(--ink) 40%,var(--b))}
.box.a .chip,.box.b .chip{background:color-mix(in srgb,#fff 70%,transparent);border-color:transparent}
.box.a .chip.on{background:var(--deep)}

/* ---- lists ---- */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;min-height:46px;border-bottom:1px solid color-mix(in srgb,var(--edge) 70%,transparent);min-width:0}
.item:last-child{border-bottom:0}
.item .t{flex:1;min-width:0;overflow-wrap:anywhere}
.item.done .t{text-decoration:line-through;text-decoration-color:var(--ink);color:var(--muted)}
.tick{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--ink);background:transparent;display:grid;place-items:center;padding:0}
.tick.on{background:var(--ink)}
.tick svg{width:12px;height:12px}
.empty{font-family:var(--hand);font-size:1.45rem;color:#9A9488;text-align:center;margin:8px 0}
.num{font-family:var(--hand);font-size:1.9rem;color:var(--ink);width:22px;flex:none;text-align:center}
.tag{font-size:.72rem;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--tintB);white-space:nowrap}

/* ---- cover ---- */
.cover{padding:64px 60px 54px;align-items:center;text-align:center;overflow:hidden;gap:0}
.cover::before,.cover::after{content:"";position:absolute;pointer-events:none}
.cover::before{inset:16px;border:1.5px solid color-mix(in srgb,var(--ink) 30%,#CDBF9F);border-radius:22px}
.cover::after{inset:25px;border:1px dashed color-mix(in srgb,var(--ink) 22%,#DCCFB4);border-radius:17px}
.cover .topline{width:100%;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:11px;letter-spacing:.28em;text-transform:uppercase;font-weight:700;color:var(--muted);position:relative;z-index:1}
.window{position:relative;margin-top:34px;width:min(400px,78%);aspect-ratio:440/540}
.window .frame{position:absolute;inset:0;border-radius:200px 200px 20px 20px;overflow:hidden}
.window .frame svg{width:100%;height:100%;display:block}
.window .ghost{position:absolute;inset:0;transform:translate(14px,-12px);border:1.5px solid var(--ink);border-radius:200px 200px 20px 20px}
.stamp{position:absolute;right:-60px;top:30px;width:130px;height:130px}
.stamp svg{width:100%;height:100%;animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.the{margin-top:30px;font-family:var(--hand);font-size:2.1rem;line-height:1;color:var(--ink)}
.title{font-family:var(--serif);font-style:italic;font-weight:300;font-size:clamp(3.6rem,13vw,7.4rem);line-height:.92;letter-spacing:-.02em;color:var(--deep)}
.planner{margin-top:12px;display:flex;align-items:center;gap:16px;font-size:13px;font-weight:700;letter-spacing:.55em;text-transform:uppercase;color:var(--deep)}
.planner span{width:60px;height:1.5px;background:var(--ink)}
.tagline{margin:18px 0 0;font-family:var(--serif);font-style:italic;font-size:1.2rem;color:var(--muted)}
.owner{margin-top:26px;display:flex;flex-direction:column;align-items:center}
.owner small{font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.owner b{font-family:var(--hand);font-weight:700;font-size:3.2rem;line-height:1.05;color:var(--ink)}
.owner i{width:240px;max-width:100%;height:1.5px;background:color-mix(in srgb,var(--ink) 30%,#CDBF9F)}
.covernav{margin-top:30px;display:flex;flex-wrap:wrap;justify-content:center;gap:9px;max-width:700px;position:relative;z-index:1}
.covernav button{min-height:44px;padding:0 18px;border-radius:999px;border:0;font-size:.9rem;font-weight:500}
.covernav button:nth-child(odd){background:var(--tintA)}
.covernav button:nth-child(even){background:var(--tintB)}
.covernav button.go{background:var(--deep);color:#FBF8F1;font-weight:700}
.sprig{position:absolute;pointer-events:none;opacity:.95}
@media (max-width:560px){.cover{padding:44px 22px 40px}.stamp{width:96px;height:96px;right:-30px;top:10px}.sprig{display:none}.owner b{font-size:2.6rem}}
@media (prefers-reduced-motion:reduce){.stamp svg{animation:none}body{transition:none}}

/* ---- jar ---- */
.jar{display:flex;flex-direction:column;align-items:center}
.jar .lid{width:64px;height:20px;border-radius:8px 8px 4px 4px;background:var(--ink)}
.jar .neck{width:88px;height:13px;border:3px solid var(--deep);border-bottom:0;border-radius:6px 6px 0 0;background:var(--paper)}
.jar .body{position:relative;width:200px;height:230px;border:3px solid var(--deep);border-radius:40px 40px 52px 52px;background:var(--paper);overflow:hidden}
.jar .body span{position:absolute;width:21px;height:21px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--deep) 30%,transparent)}
.jar .label{position:absolute;left:28px;right:28px;top:62px;padding:6px 0;background:var(--b);border-radius:6px;font-family:var(--hand);font-size:1.4rem;color:var(--deep);text-align:center}
.slip{background:var(--paper);border-radius:14px;padding:12px 16px;border:1.5px dashed var(--ink);text-align:center}
.slip .inkthumb{display:block;width:100%;max-width:300px;max-height:180px;margin:0 auto 6px}

/* ---- week / month ---- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--edge);border-radius:18px;padding:12px 14px}
.stat:nth-child(odd){background:var(--tintA);border-color:transparent}
.stat b{display:block;font-family:var(--serif);font-style:italic;font-weight:400;font-size:2rem;line-height:1.1;color:var(--deep);font-variant-numeric:tabular-nums}
.stat span{font-size:.76rem;color:var(--muted);font-weight:500}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.86rem;font-variant-numeric:tabular-nums}
th,td{padding:9px 6px;text-align:center;border-bottom:1px solid var(--edge);white-space:nowrap}
th{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
td.l,th.l{text-align:left}
.pdot{display:inline-flex;vertical-align:middle;margin-right:6px}
.pdot i{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:-3px;border:1.5px solid var(--paper)}
.bar{height:8px;border-radius:99px;background:color-mix(in srgb,var(--edge) 80%,transparent);overflow:hidden;min-width:50px}
.bar i{display:block;height:100%;background:var(--ink);border-radius:99px}
.hg{display:inline-block;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--rule)}
.hg.on{background:var(--ink);border-color:var(--ink)}
.linkbtn{border:0;background:none;padding:0;font-weight:700;color:var(--text)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dow{font-size:.66rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);text-align:center;font-weight:700}
.cal button{aspect-ratio:1;max-width:100%;border:0;border-radius:12px;padding:5px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;font-family:var(--serif);font-size:.95rem;min-width:0;position:relative;overflow:hidden;color:var(--text)}
.cal .fill{position:absolute;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--deep) 28%,transparent)}
.cal button span{position:relative;font-family:var(--sans);font-size:.62rem}
.cal button b{position:relative;font-weight:400}
.cal button.today{outline:2px solid var(--deep);outline-offset:1px}
.cal button.fut{opacity:.45}

/* ---- vision ---- */
.subnav{display:flex;gap:8px;flex-wrap:wrap}
.subnav button{min-height:44px;padding:0 16px;border-radius:999px;border:0;background:var(--tintA);font-size:.9rem;font-weight:500}
.subnav button.on{background:var(--deep);color:#FBF8F1}
.step{display:flex;gap:16px;align-items:flex-start}
.step .n{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-style:italic;font-size:1.2rem;background:var(--tintB);color:var(--deep)}
.step .n.ok{background:var(--deep);color:#FBF8F1}
.step .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.tile{position:relative;aspect-ratio:1;max-width:100%;border-radius:14px;overflow:hidden;display:grid;place-items:center;padding:10px;text-align:center;font-family:var(--hand);font-size:1.5rem;line-height:1.05;color:var(--deep)}
.tile:nth-child(3n+1){transform:rotate(-1.5deg)}.tile:nth-child(3n){transform:rotate(1.2deg)}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile .x{position:absolute;top:4px;right:4px;width:auto;min-width:28px;height:28px;background:color-mix(in srgb,#fff 85%,transparent);font-family:var(--sans);font-size:.8rem;padding:0 6px}
.areaicon{width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center}
.areaicon svg{width:20px;height:20px}

/* ---- youtube / jobs ---- */
.vid{border:1px solid var(--edge);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;background:var(--paper)}
.stages{display:flex;flex-wrap:wrap;gap:4px}
.stages button{border:0;border-radius:999px;min-height:30px;padding:0 11px;font-size:.74rem;font-weight:700;background:color-mix(in srgb,var(--edge) 70%,transparent);color:var(--muted)}
.stages button.past{background:var(--tintA);color:var(--deep)}
.stages button.on{background:var(--deep);color:#FBF8F1}
.app-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--edge)}
.app-row select{border:1px solid var(--edge);border-radius:10px;background:var(--paper);padding:6px 8px;font-size:.84rem}
.app-row .who{min-width:0;overflow-wrap:anywhere}
details summary{cursor:pointer;font-weight:700;color:var(--deep)}
details ul{margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--b);display:inline-block}
.dots i.on{background:var(--b)}
.dots .gap{width:8px;border:0}


/* ---- type or pencil ---- */
.modesw{display:inline-flex;align-self:flex-start;background:var(--paper);border:1px solid var(--edge);border-radius:999px;padding:3px;gap:2px}
.modesw button{border:0;background:none;border-radius:999px;min-height:36px;padding:0 15px;font-size:.82rem;font-weight:700;color:var(--muted)}
.modesw button.on{background:var(--deep);color:#FBF8F1}
.inkbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;position:sticky;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:3;background:var(--card);border:1px solid var(--edge);border-radius:18px;padding:6px 8px;box-shadow:0 4px 14px -10px rgba(0,0,0,.3)}
.inkbar .sep{width:1px;height:24px;background:var(--edge);margin:0 2px}
.inkbar .sw{width:32px;height:32px;border-radius:50%;border:2.5px solid var(--card);box-shadow:0 0 0 1.5px var(--edge);padding:0}
.inkbar .sw.on{box-shadow:0 0 0 2.5px var(--deep)}
.inkbar .size{width:36px;height:36px;border:0;border-radius:50%;background:none;display:grid;place-items:center}
.inkbar .size i{display:block;border-radius:50%;background:var(--deep)}
.inkbar .size.on{background:var(--tintA)}
.inkbar .tool{min-height:34px;border:0;border-radius:999px;padding:0 12px;font-size:.8rem;font-weight:700;background:var(--tintB);color:var(--deep)}
.inkbar .tool.on{background:var(--deep);color:#FBF8F1}

function setPath(o,path,v){const p=path.split(".");let c=o;for(let i=0;i<p.length-1;i++){const k=p[i];if(c[k]==null)c[k]=/^\d+$/.test(p[i+1])?[]:{};c=c[k]}c[p[p.length-1]]=v}
function getPath(o,path){return path.split(".").reduce((c,k)=>c==null?undefined:c[k],o)}
const bind=(id,path,ph,tag="input",extra="")=>{
  const d=S.docs[id];const v=d?getPath(d,path):"";
  const eid="f-"+id+"-"+path.replace(/\./g,"-");
  return tag==="textarea"
   ?`<textarea id="${eid}" data-doc="${id}" data-path="${path}" placeholder="${esc(ph)}" ${extra}>${esc(v)}</textarea>`
   :`<input type="text" id="${eid}" data-doc="${id}" data-path="${path}" placeholder="${esc(ph)}" value="${esc(v)}" ${extra}>`;
};

function hex2rgb(h){h=h.replace("#","");if(h.length===3)h=h.split("").map(c=>c+c).join("");return[0,2,4].map(i=>parseInt(h.slice(i,i+2),16))}
function mix(h1,h2,t){const a=hex2rgb(h1),b=hex2rgb(h2);return"#"+a.map((v,i)=>Math.round(v+(b[i]-v)*t).toString(16).padStart(2,"0")).join("")}

const GRAT_INK=["grat.note","grat.hand"];
const gratInk=k=>GRAT_INK.filter(p=>hasInk(inkKey("d-"+k,p))).length;
function allSlips(){
  const out=[],days=new Set();
  for(const id in S.docs){
    if(id.startsWith("d-"))days.add(id.slice(2));
    else{const m=/^ink-d-(\d{4}-\d\d-\d\d)-grat_(note|hand)$/.exec(id);if(m)days.add(m[1])}}
  days.forEach(k=>{const g=(S.docs["d-"+k]||{}).grat||{};
    (g.items||[]).forEach(t=>{if(t&&t.trim())out.push({t,k})});
    if(g.note&&g.note.trim())out.push({t:(g.to?"Thank you, "+g.to+": ":"")+g.note,k});
    if(g.hand&&g.hand.trim())out.push({t:g.hand,k});
    GRAT_INK.forEach(p=>{const key=inkKey("d-"+k,p);if(hasInk(key))out.push({t:p==="grat.note"&&g.to?"A handwritten thank-you to "+g.to:"Written by hand",k,ink:key})});});
  return out.sort((a,b)=>a.k<b.k?-1:1);
}
/* a small drawing of a handwritten slip, cropped to the writing */
function inkSVG(key){
  const d=S.docs[key];if(!d||!d.strokes||!d.strokes.length)return"";
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  d.strokes.forEach(st=>{for(let i=0;i<st.pts.length;i+=3){const x=st.pts[i],y=st.pts[i+1];if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}});
  const pad=14,w=Math.max(60,x1-x0+pad*2),h=Math.max(30,y1-y0+pad*2);
  const paths=d.strokes.map(st=>{const a=st.pts;let dd="M"+a[0]+" "+a[1];for(let i=3;i<a.length;i+=3)dd+="L"+a[i]+" "+a[i+1];if(a.length<6)dd+="l.1 .1";
    return`<path d="${dd}" stroke="${st.c}" stroke-width="${(st.s*(1000/700)*(st.hl?5:.9)).toFixed(2)}"${st.hl?' opacity=".45"':""}/>`}).join("");
  return`<svg class="inkthumb" viewBox="${x0-pad} ${y0-pad} ${w} ${h}" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Your handwritten slip">${paths}</svg>`;
}

function inkDoc(key,minH,w){
  if(!S.docs[key])S.docs[key]={h:Math.max(.6,minH/Math.max(w,300)),strokes:[]};
  return S.docs[key];
}
function strokeWidth(st,w,p){return st.s*(w/700)*(st.hl?5:(.45+.9*p))}
function drawStroke(ctx,st,w){
  const a=st.pts;if(!a||a.length<3)return;
  const X=i=>a[i]*w/1000,Y=i=>a[i+1]*w/1000;
  ctx.save();ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle=st.c;
  if(st.hl){ctx.globalAlpha=.45;ctx.globalCompositeOperation="multiply";ctx.lineWidth=strokeWidth(st,w,.5);ctx.beginPath();ctx.moveTo(X(0),Y(0));
    for(let i=3;i<a.length;i+=3)ctx.lineTo(X(i),Y(i));if(a.length===3)ctx.lineTo(X(0)+.1,Y(0));ctx.stroke();ctx.restore();return}
  if(a.length===3){ctx.fillStyle=st.c;ctx.beginPath();ctx.arc(X(0),Y(0),strokeWidth(st,w,a[2]/100)/2,0,7);ctx.fill();ctx.restore();return}
  for(let i=3;i<a.length;i+=3){
    ctx.lineWidth=strokeWidth(st,w,a[i+2]/100);ctx.beginPath();
    const px=X(i-3),py=Y(i-3),cx=X(i),cy=Y(i);
    if(i>=6){const mx=(X(i-6)+px)/2,my=(Y(i-6)+py)/2;ctx.moveTo(mx,my);ctx.quadraticCurveTo(px,py,(px+cx)/2,(py+cy)/2)}else{ctx.moveTo(px,py);ctx.lineTo((px+cx)/2,(py+cy)/2)}
    ctx.stroke();
  }
  ctx.restore();
}
class Pad{
  constructor(el){
    this.el=el;el._pad=this;this.key=el.dataset.ink;this.minH=Number(el.dataset.minh)||400;
    this.cv=el.querySelector("canvas");this.ctx=this.cv.getContext("2d");this.fit();
    const cv=this.cv;
    cv.addEventListener("pointerdown",e=>this.down(e));
    cv.addEventListener("pointermove",e=>this.move(e));
    ["pointerup","pointercancel","pointerleave"].forEach(n=>cv.addEventListener(n,e=>this.up(e)));
    cv.addEventListener("touchstart",e=>{if(!S.penSeen||[...e.touches].some(t=>t.touchType==="stylus"))e.preventDefault()},{passive:false});
  }
  get data(){return inkDoc(this.key,this.minH,this.el.clientWidth||700)}
  fit(){
    const w=this.el.clientWidth||700,h=Math.round(w*this.data.h),r=window.devicePixelRatio||1;
    this.el.style.height=h+"px";this.cv.width=Math.round(w*r);this.cv.height=Math.round(h*r);
    this.ctx.setTransform(r,0,0,r,0,0);this.w=w;this.redraw();
  }
  redraw(){this.ctx.clearRect(0,0,this.w,this.w*this.data.h+10);this.data.strokes.forEach(s=>drawStroke(this.ctx,s,this.w))}
  pt(e){const b=this.cv.getBoundingClientRect(),k=1000/this.w;
    const p=e.pointerType==="pen"?(e.pressure||.5):.5;
    return[Math.round((e.clientX-b.left)*k*10)/10,Math.round((e.clientY-b.top)*k*10)/10,Math.round(p*100)]}
  down(e){
    if(e.pointerType==="pen")S.penSeen=true;
    if(e.pointerType==="touch"&&S.penSeen){this.scrollY=e.clientY;return}
    e.preventDefault();try{this.cv.setPointerCapture(e.pointerId)}catch(_){}
    if(S.ink.tool==="eraser"){this.erasing=[];this.erase(e);return}
    const cols=inkColors(),ci=Math.min(S.ink.color,cols.length-1);
    this.cur={c:cols[ci][1],s:SIZES[S.ink.size][1],pts:this.pt(e)};if(cols[ci][0]==="Highlighter")this.cur.hl=1;
    drawStroke(this.ctx,this.cur,this.w);
  }
  move(e){
    if(this.scrollY!=null){window.scrollBy(0,this.scrollY-e.clientY);this.scrollY=e.clientY;return}
    if(this.erasing){e.preventDefault();this.erase(e);return}
    if(!this.cur)return;e.preventDefault();
    const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
    for(const ev of evs.length?evs:[e]){const p=this.pt(ev),a=this.cur.pts,n=a.length;
      if(Math.abs(p[0]-a[n-3])+Math.abs(p[1]-a[n-2])<.8)continue;a.push(...p);
      if(this.cur.hl){this.redraw();drawStroke(this.ctx,this.cur,this.w)}
      else{const seg={c:this.cur.c,s:this.cur.s,pts:a.slice(Math.max(0,a.length-9))};drawStroke(this.ctx,seg,this.w)}}
  }
  up(e){
    if(this.scrollY!=null){this.scrollY=null;return}
    if(this.erasing){if(this.erasing.length){(S.inkHist[this.key]=S.inkHist[this.key]||[]).push({del:this.erasing});save(this.key);jarRefresh(this.key)}this.erasing=null;return}
    if(!this.cur)return;
    const st=this.cur;this.cur=null;this.data.strokes.push(st);
    (S.inkHist[this.key]=S.inkHist[this.key]||[]).push({add:st});
    this.redraw();save(this.key);jarRefresh(this.key);
  }
  erase(e){
    const[x,y]=this.pt(e),r=14,d=this.data,keep=[];
    d.strokes.forEach(s=>{let hit=false;for(let i=0;i<s.pts.length;i+=3)if(Math.abs(s.pts[i]-x)<r&&Math.abs(s.pts[i+1]-y)<r){hit=true;break}
      if(hit)this.erasing.push(s);else keep.push(s)});
    if(keep.length!==d.strokes.length){d.strokes=keep;this.redraw()}
  }
}

function habitGrid(keys,head){

function bestStreak(keys,hid){let b=0,c=0;keys.forEach(k=>{if(habitOn(k,hid)){c++;b=Math.max(b,c)}else c=0});return b}

function vYear(){
  const y=parse(S.view).getFullYear(),st=doc("settings"),t=todayKey();
  const keys=[];for(let d=new Date(y,0,1);d.getFullYear()===y;d.setDate(d.getDate()+1))keys.push(dkey(d));
  const past=keys.filter(k=>k<=t),ss=keys.map(dayStats),sum=f=>ss.reduce((a,s)=>a+f(s),0);
  const sel=S.yhab&&st.habits.some(h=>h.id===S.yhab)?S.yhab:"all";
  const yt=doc("yt").videos.filter(v=>inRange(v.posted,keys[0],keys[keys.length-1])).length;
  const apps=doc("jobs").apps.filter(a=>inRange(a.date,keys[0],keys[keys.length-1])&&a.status!=="Saved").length;
  let rows="";
  for(let m=0;m<12;m++){
    const n=new Date(y,m+1,0).getDate();let cells="";
    for(let d=1;d<=31;d++){
      if(d>n){cells+=`<span class="yb none"></span>`;continue}
      const k=dkey(new Date(y,m,d)),s=ss[keys.indexOf(k)],p=pal(k),fut=k>t;
      let bg="";
      if(sel==="all"){const pct=s.habN?s.hab/s.habN:0;if(pct>0)bg=mix(p.a,p.ink,.15+.6*pct)}
      else if(habitOn(k,sel))bg=doneColour(k);
      cells+=`<button class="yb ${fut?"fut":""} ${k===t?"today":""}" style="${bg?"background:"+bg:""}" data-act="go" data-v="${k}" aria-label="${fmt(k,{day:"numeric",month:"long"})}"></button>`;
    }
    rows+=`<div class="yrow"><span class="ym">${new Date(y,m,1).toLocaleDateString(undefined,{month:"short"})}</span><div class="ycells">${cells}</div></div>`;
  }
  return `
  <div class="head fade">${archScene("mtn")}<div><div class="eyebrow">Yearly · fills itself in</div><h1>My ${y}<br>in colour</h1>
    <p class="lede">Every habit you tick on your daily page colours its box here. Tap any box to open that day.</p></div></div>
  <section class="box">
    <div class="chips"><button class="chip ${sel==="all"?"on":""}" data-act="yhab" data-v="all">All habits</button>${st.habits.map(h=>`<button class="chip ${sel===h.id?"on":""}" data-act="yhab" data-v="${h.id}">${esc(h.name)}</button>`).join("")}</div>
    <div class="scroll"><div class="year">${rows}</div></div>
    <p class="small muted" style="margin:0">${sel==="all"?"Darker boxes mean more habits kept that day.":"Coloured boxes are the days you kept this habit."}</p>
  </section>
  <div class="stats">
    <div class="stat"><b>${ss.filter(s=>s.wrote).length}</b><span>journal days</span></div>
    <div class="stat"><b>${sum(s=>s.grat)}</b><span>gratitude slips</span></div>
    <div class="stat"><b>${sum(s=>s.done)}</b><span>to-dos done</span></div>
    <div class="stat"><b>${yt}</b><span>videos posted</span></div>
    <div class="stat"><b>${apps}</b><span>applications</span></div>
  </div>
  <section class="box a"><h2>Habits this year</h2>
    ${st.habits.map(h=>{const c=past.filter(k=>habitOn(k,h.id)).length;return `<div style="display:flex;flex-direction:column;gap:5px"><div class="boxhead small"><span>${esc(h.name)}</span><span class="muted">${c} days · best streak ${bestStreak(past,h.id)}</span></div><div class="bar"><i style="width:${Math.min(100,Math.round(100*c/Math.max(1,past.length)))}%"></i></div></div>`}).join("")}
  </section>
  <p class="footline">Little by little, a whole year of growing.</p>`;
}

/* ---------- little celebrations ---------- */
function habitStreak(k,hid){let n=0,c=k;while(habitOn(c,hid)){n++;c=addDays(c,-1)}return n}
function allHabitsDone(k){const st=doc("settings"),d=peekDay(k);return st.habits.length>0&&!!d&&st.habits.every(h=>d.habits&&d.habits[h.id])}
function allStreak(k){let n=0,c=k;while(allHabitsDone(c)){n++;c=addDays(c,-1)}return n}
const flowerSVG=(c1,c2)=>`<svg viewBox="0 0 40 40" aria-hidden="true">${[0,72,144,216,288].map(r=>`<ellipse cx="20" cy="10" rx="7" ry="10" fill="${c1}" transform="rotate(${r} 20 20)"/>`).join("")}<circle cx="20" cy="20" r="6" fill="${c2}"/></svg>`;
function celebrate(title,line){
  document.getElementById("bloom")?.remove();
  const p=pal(S.view),cols=[p.a,p.b,mix(p.a,p.ink,.3),mix(p.b,"#F29A5C",.35),"#ffffff"];
  const calm=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  let petals="";
  if(!calm)for(let i=0;i<34;i++){
    const ang=Math.random()*Math.PI*2,dist=160+Math.random()*260,x=Math.cos(ang)*dist,y=Math.sin(ang)*dist-80,size=18+Math.random()*26;
    petals+=`<span class="petal" style="--x:${x.toFixed(0)}px;--y:${y.toFixed(0)}px;--r:${(Math.random()*540-270).toFixed(0)}deg;--d:${(Math.random()*.25).toFixed(2)}s;width:${size.toFixed(0)}px;height:${size.toFixed(0)}px">${flowerSVG(cols[i%5],cols[(i+2)%5])}</span>`;
  }
  const el=document.createElement("div");el.id="bloom";el.setAttribute("role","status");
  el.innerHTML=`${petals}<div class="bloomcard"><div class="bigflower">${flowerSVG(p.a,mix(p.b,"#F29A5C",.45))}</div><div class="bt">${title}</div><div class="bl">${line}</div></div>`;
  el.addEventListener("click",()=>el.remove());
  document.body.appendChild(el);
  setTimeout(()=>{el.classList.add("out");setTimeout(()=>el.remove(),500)},4200);
}
function checkHabitWin(k,hid){
  const st=doc("settings"),h=st.habits.find(x=>x.id===hid);
  if(allHabitsDone(k)){const s=allStreak(k);
    if(s>=7&&s%7===0)return celebrate(s+" perfect days in a row","Every habit, every day. You are flourishing.");
    return celebrate("All habits done today","You kept every promise to yourself. That's how big dreams happen.");}
  const s=habitStreak(k,hid);
  if(h&&s>=7&&s%7===0)celebrate(s+"-day streak","“"+esc(h.name)+"” for "+s+" days in a row. Keep blooming.");
}
{const old=A.habit;A.habit=v=>{const was=habitOn(S.view,v);old(v);if(!was)checkHabitWin(S.view,v)}}

/* ---------- backup and restore ---------- */
function toast(msg){
  document.getElementById("toast")?.remove();
  const t=document.createElement("div");t.id="toast";t.setAttribute("role","status");t.textContent=msg;document.body.appendChild(t);
  setTimeout(()=>{t.classList.add("out");setTimeout(()=>t.remove(),400)},3200);
}
async function exportBackup(){
  const name="flourish-backup-"+todayKey()+".json";
  const data=JSON.stringify({app:"flourish",version:1,savedAt:new Date().toISOString(),docs:S.docs});
  try{
    if(window.claude&&window.claude.use){const dl=await claude.use("downloads");
      if(dl){try{await dl.save({filename:name,data});toast("Backup saved: "+name);return}catch(e){if(e&&e.code==="declined")return}}}
  }catch(e){}
  try{
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download=name;
    document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
    toast("Backup saved: "+name);
  }catch(e){toast("The backup couldn't be saved on this device.")}
}
function restoreBackup(file){
  const fr=new FileReader();
  fr.onload=()=>{
    let o;try{o=JSON.parse(fr.result)}catch(e){toast("That file isn't a Flourish backup.");return}
    if(!o||o.app!=="flourish"||!o.docs){toast("That file isn't a Flourish backup.");return}
    let n=0;
    for(const k in o.docs){const inc=o.docs[k],cur=S.docs[k];
      if(!cur||(inc._t||0)>(cur._t||0)){S.docs[k]=inc;n++;
        if(S.db&&S.uid)push(k)}}
    lsSave();render();
    toast(n?"Restored "+n+" page"+(n>1?"s":"")+" from your backup.":"Everything in that backup was already here.");
  };
  fr.readAsText(file);
}
document.addEventListener("change",e=>{if(e.target.id==="restore-file"&&e.target.files&&e.target.files[0]){restoreBackup(e.target.files[0]);e.target.value=""}});
A.backup=()=>exportBackup();

    <div class="addrow"><input class="pill" type="text" id="vb-word" placeholder="A word, a dream, a quote…" data-enter="vbWord"><button class="btn" data-act="vbWord">Add words</button></div>

      <label class="chip" style="display:inline-flex;align-items:center;cursor:pointer">＋ Photo<input type="file" accept="image/*" id="vb-photo" hidden></label>
      <button class="chip" data-act="vbNote">＋ Sticky note</button>
      <button class="chip" data-act="vbTape">＋ Washi tape</button>
      <button class="chip ${S.vstk?"on":""}" data-act="vbStk">＋ Stickers</button>
    </div>
    ${S.vstk?`<div class="vbstk">${Object.keys(STK).map(k=>`<button data-act="vbSticker" data-v="${k}" title="${STK_NAMES[k]}" aria-label="${STK_NAMES[k]} sticker">${stkSVG(k)}</button>`).join("")}</div>`:""}
    ${fromJournal.length?`<div class="vbfrom"><span class="small muted">From your vision journal:</span> ${fromJournal.slice(0,7).map(t=>`<button class="chip" data-act="vbFrom" data-v="${esc(t)}">${esc(t.length>28?t.slice(0,28)+"…":t)}</button>`).join("")}</div>`:""}
  </div>
  ${ctx}
  ${board}
  <div class="spread" style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center">
    <div class="chips"><span class="small muted" style="align-self:center">Background:</span>${VB_BG.map(([k,n])=>`<button class="chip ${b.bg===k?"on":""}" data-act="vbBg" data-v="${k}">${n}</button>`).join("")}</div>
    ${b.items.length?`<button class="btn sm line2" data-act="vbClear">${S.confirm==="vbclear"?"Tap again to clear the board":"Clear board"}</button>`:""}
  </div>
  <p class="footline">Make it so beautiful you can't wait to look at it.</p>`;
}

/* dragging, resizing, rotating */
let VBD=null;
document.addEventListener("pointerdown",e=>{
  if(S.vview)return;
  const h=e.target.closest("[data-vbh]"),it=e.target.closest("[data-vbi]"),board=e.target.closest("#vboard");
  if(!board)return;
  if(!it&&!h){if(S.vsel){S.vsel=null;render()}return}
  e.preventDefault();
  const id=(h||it).dataset.vbh||(h||it).dataset.vbi,o=vbFind(id);if(!o)return;
  const bw=board.getBoundingClientRect().width,k=100/bw;
  if(h){const r=it.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
    VBD={id,mode:"rs",cx,cy,d0:Math.hypot(e.clientX-cx,e.clientY-cy),a0:Math.atan2(e.clientY-cy,e.clientX-cx),w0:o.w,r0:o.r||0};}
  else VBD={id,mode:"mv",sx:e.clientX,sy:e.clientY,x0:o.x,y0:o.y,k,moved:false};
  if(S.vsel!==id){S.vsel=id;render()}
});
document.addEventListener("pointermove",e=>{
  if(!VBD)return;const o=vbFind(VBD.id);if(!o)return;e.preventDefault();
  if(VBD.mode==="mv"){o.x=Math.round((VBD.x0+(e.clientX-VBD.sx)*VBD.k)*10)/10;o.y=Math.round((VBD.y0+(e.clientY-VBD.sy)*VBD.k)*10)/10;
    o.x=Math.max(-o.w*.6,Math.min(100-o.w*.4,o.x));o.y=Math.max(-5,Math.min(122,o.y));VBD.moved=true}
  else{const d=Math.hypot(e.clientX-VBD.cx,e.clientY-VBD.cy),a=Math.atan2(e.clientY-VBD.cy,e.clientX-VBD.cx);
    const nw=Math.max(6,Math.min(100,VBD.w0*d/Math.max(10,VBD.d0)));o.x+= (o.w-nw)/2;o.y+=(o.w-nw)/2*.5;o.w=Math.round(nw*10)/10;o.r=Math.round(VBD.r0+(a-VBD.a0)*180/Math.PI)}
  const el=document.querySelector(`[data-vbi="${VBD.id}"]`);
  if(el){el.style.left=o.x+"cqw";el.style.top=o.y+"cqw";el.style.width=o.w+"cqw";el.style.transform=`rotate(${o.r||0}deg)`;
    const t=el.querySelector(".vbt");if(t)t.style.fontSize=vbFS(o)+"cqw";const n=el.querySelector(".vbn span,.vbp span");if(n)n.style.fontSize=(o.w*(o.t==="note"?.11:.09)).toFixed(2)+"cqw"}
},{passive:false});
document.addEventListener("pointerup",()=>{if(VBD){VBD=null;save("vision")}});
document.addEventListener("pointercancel",()=>{if(VBD){VBD=null;save("vision")}});
document.addEventListener("input",e=>{const id=e.target.dataset&&e.target.dataset.vbedit;if(!id)return;const o=vbFind(id);if(!o)return;o.text=e.target.value;save("vision");
  const el=document.querySelector(`[data-vbi="${id}"] .vbt,[data-vbi="${id}"] .vbn span,[data-vbi="${id}"] .vbp span`);if(el)el.textContent=e.target.value;else render()});
document.addEventListener("change",async e=>{
  if(e.target.id!=="vb-photo"||!e.target.files||!e.target.files[0])return;
  try{const blob=await shrink(e.target.files[0]);let src=null;
    if(S.assets){try{src=(await S.assets.upload(blob)).url}catch(_){}}
    if(!src)src=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(blob)});
    vbAdd({t:"photo",src,frame:"polaroid",text:"",w:32});
  }catch(_){toast("That photo couldn't be added. Try another one.")}
});
Object.assign(A,{
  vbWord:()=>{const t=val("vb-word");if(t)vbAdd({t:"text",text:t,font:"hand",color:VB_COLS[1],w:Math.min(70,Math.max(24,t.length*3.2))})},
  vbFrom:v=>vbAdd({t:"text",text:v,font:"hand",color:VB_COLS[2],w:Math.min(70,Math.max(24,v.length*3))}),
  vbNote:()=>vbAdd({t:"note",text:"I am…",color:VB_PAPER[Math.floor(Math.random()*6)],font:"hand",w:26}),
  vbTape:()=>vbAdd({t:"tape",color:VB_TAPE[Math.floor(Math.random()*VB_TAPE.length)],w:18,r:Math.round(Math.random()*30-15)}),
  vbStk:()=>{S.vstk=!S.vstk;render()},
  vbSticker:v=>vbAdd({t:"sticker",s:v,w:16}),
  vbColor:v=>{const o=vbFind(S.vsel);if(o){o.color=v;save("vision");render()}},
  vbFont:v=>{const o=vbFind(S.vsel);if(o){o.font=v;save("vision");render()}},
  vbFrame:v=>{const o=vbFind(S.vsel);if(o){o.frame=v;save("vision");render()}},
  vbFront:()=>{const b=vbBoard(),i=b.items.findIndex(x=>x.id===S.vsel);if(i>=0){b.items.push(b.items.splice(i,1)[0]);save("vision");render()}},
  vbCopy:()=>{const o=vbFind(S.vsel);if(o){const c=JSON.parse(JSON.stringify(o));c.x+=4;c.y+=4;delete c.id;vbAdd(c)}},
  vbDel:()=>{const b=vbBoard();b.items=b.items.filter(x=>x.id!==S.vsel);S.vsel=null;save("vision");render()},
  vbDone:()=>{S.vsel=null;render()},
  vbBg:v=>{vbBoard().bg=v;save("vision");render()},
  vbStart:()=>vbStarter(),
  vbView:()=>{S.vview=!S.vview;S.vsel=null;render();window.scrollTo({top:0})},
  vbClear:()=>{if(S.confirm!=="vbclear"){S.confirm="vbclear";render();return}S.confirm=null;vbBoard().items=[];S.vsel=null;save("vision");render()}
});

render();
connect();
</script>
